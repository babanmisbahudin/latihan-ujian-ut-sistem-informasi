ry words", "Avoid suggesting a solution"], "k": 0, "w": "", "id": "e10bc5d1d4"}, {"g": "Sesi 5", "src": "Latihan", "q": "When thanking someone for a money gift, you should ...", "a": ["State the exact amount", "Not mention the amount", "Ask for more", "Wait several months"], "k": 1, "w": "", "id": "065939842a"}, {"g": "Sesi 6", "src": "Latihan", "q": "In a cover letter, \"as recently advertised in the Herald newspaper\" tells the reader ...", "a": ["Where the applicant found the job", "The applicant's hobbies", "The salary", "The applicant's references"], "k": 0, "w": "", "id": "37365e37ab"}, {"g": "Sesi 6", "src": "Latihan", "q": "An application sent on your own initiative without a published vacancy is ...", "a": ["Solicited", "Unsolicited", "Chronological", "Functional"], "k": 1, "w": "", "id": "b33c101a9c"}, {"g": "Sesi 6", "src": "Latihan", "q": "Two common types of resume are ...", "a": ["Functional and chronological", "Solicited and unsolicited", "Formal and casual", "Directive and complimentary"], "k": 0, "w": "", "id": "a2a266c12b"}, {"g": "Sesi 7", "src": "Latihan", "q": "Receptionist: \"We had a cancellation at 3 p.m. Is that okay?\" Linda: \"Yes, that would be perfect.\" Linda is ...", "a": ["Agreeing to an appointment", "Cancelling an appointment", "Rejecting an offer", "Asking for clarification"], "k": 0, "w": "", "id": "54c9dc154a"}, {"g": "Sesi 7", "src": "Latihan", "q": "\"With all due respect, I must decline your offer\" is an expression of ...", "a": ["Accepting", "Rejecting", "Summarizing", "Welcoming"], "k": 1, "w": "", "id": "4522653eb5"}, {"g": "Sesi 7", "src": "Latihan", "q": "The last important step before ending an appointment call is to ...", "a": ["Confirm the appointment", "Change the topic", "Cancel it", "Ask about salary"], "k": 0, "w": "", "id": "9468b1b440"}, {"g": "Sesi 7", "src": "Latihan", "q": "Which is a tip for giving a clear explanation?", "a": ["Use analogies and check understanding", "Speak as long as possible", "Ignore questions", "Avoid examples"], "k": 0, "w": "", "id": "f71f7de88e"}, {"g": "Sesi 7", "src": "Latihan", "q": "An outcome in which both parties benefit is called ...", "a": ["Win-win", "Win-lose", "Lose-lose", "Hard bargaining"], "k": 0, "w": "", "id": "3be32681c8"}], "esai": [["Bedakan bahasa Inggris formal dan informal dengan contoh.", "Formal: tanpa kontraksi/slang, kalimat panjang (We regret to inform you). Informal: kontraksi, idiom (Sorry, we can't). Kapan dipakai."], ["Tulis memo: pelatihan CPR wajib Jumat pukul 15.00.", "To, From, Date, Subject; isi singkat: tujuan, waktu, tempat, kewajiban; penutup."], ["Bedakan email dan memo bisnis.", "Memo internal, singkat, langsung; email internal dan eksternal, ada salutation, opening, closing."], ["Tulis surat permintaan katalog dan harga.", "Opening perkenalan; content Could you please…; closing We look forward to hearing from you."], ["Bedakan cover letter dan CV.", "Cover letter menjelaskan alasan melamar; CV merangkum data, pendidikan, pengalaman, urut terbaru, 1–2 halaman."], ["Find three errors: \"Thank u for your letter of july 5 about prices and terms of payment? We look forward to receive your order.\"", "u → you; july → July; tanda tanya → titik; receive → receiving."], ["Write a complaint letter about expired cookies and request a refund or exchange.", "Jelaskan pembelian, masalah, kekecewaan, solusi yang diminta, dan penutup sopan."]]};
(()=>{const h=document.querySelector('h1');const m=h.textContent.match(/^Latihan (\S+) (.+)$/);if(!m)return;h.textContent=m[2];const e=document.getElementById('kodeMk');if(e)e.textContent=m[1];const c=document.getElementById('crumbNama');if(c)c.textContent=m[2]})();const KEY='latihan_ut_'+D.kode;

function catat(q,ok){const l=S.log[q.id]||[0,0,0,0];S.log[q.id]=[l[0]+1,l[1]+(ok?1:0),ok?1:0,Date.now()];

/* Perkiraan nilai: soal yang sudah dijawab memakai hasil jawaban terakhir; soal yang belum dijawab dihitung 25% (setara menebak 1 dari 4).
   Jika ada simulasi, rata-rata 3 simulasi terakhir ikut dihitung setengah bobot. */
function hitung(){const grup={};for(const q of D.q){const g=grup[q.g]=grup[q.g]||{N:0,A:0,C:0};g.N++;const l=S.log[q.id];if(l){g.A++;g.C+=l[2]}}
 let A=0,C=0,harap=0;for(const g of Object.values(grup)){A+=g.A;C+=g.C;harap+=g.C+(g.N-g.A)*0.25}
 let est=harap/D.q.length*100;const sim=S.sims.slice(-3);if(sim.length){est=0.5*est+0.5*(sim.reduce((a,b)=>a+b.p,0)/sim.length)}
 const p=A?C/A:0;const rentang=Math.max(3,Math.round(Math.min(25,196*Math.sqrt(Math.max(p*(1-p),0.04)/Math.max(A,1)))));
 return {grup,A,C,est:Math.round(est),rentang,cukup:A>=20,akurasi:A?Math.round(C/A*100):0,dikuasai:D.q.filter(q=>S.benar[q.id]).length,salah:D.q.filter(q=>S.salah[q.id]).length}}

 if(!lemah){const b=Object.keys(H.grup).sort(urutSesi).find(g=>H.grup[g].A<H.grup[g].N);if(b)lemah={g:b,ak:H.grup[b].A?Math.round(H.grup[b].C/H.grup[b].A*100):null}}return lemah}
