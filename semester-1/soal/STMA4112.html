<title>Latihan STMA4112 Matematika Dasar</title>
<style>

  const buka=el('button',{cls:'pri'},'Buka jawaban');const next=el('button',{on:()=>{i++;show()}},'Berikutnya →');
  const flip=()=>{if(!buka.isConnected)return;buka.replaceWith(el('div',{cls:'fb ok'},el('b',{},q.a[q.k]),q.w?' — '+q.w:''));next.focus()};buka.onclick=flip;
  c.append(buka,el('div',{cls:'cta'},next),el('div',{cls:'hint'},'Pintasan: Spasi untuk membuka, Enter untuk berikutnya.'));app.append(c,el('div',{cls:'foot'},el('button',{on:menu},'Kembali ke menu')));
